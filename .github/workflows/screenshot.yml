name: README screenshot
on:
  push:
    branches: [main]
    paths: ["public/**", "demo.mjs", "scripts/screenshot.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/screenshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshot.png
          git diff --cached --quiet && echo "screenshot unchanged" && exit 0
          git commit -m "Update README screenshot"
          git push
